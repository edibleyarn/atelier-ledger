</div>

<dialog id="dlg"><form id="dlg-form" novalidate></form></dialog>
<input type="file" id="file-input" multiple hidden>

<script>
(function () {
  const STATUSES = [
    ['todo', 'Not started'],
    ['doing', 'In progress'],
    ['waiting', 'Waiting on client'],
    ['done', 'Done'],
  ];
  const STATUS_LABEL = Object.fromEntries(STATUSES);
  const PAY = { unpaid: 'Unpaid', deposit: 'Deposit paid', paid: 'Paid in full' };
  const PAY_NEXT = { unpaid: 'deposit', deposit: 'paid', paid: 'unpaid' };
  const PAY_TYPES = { money: 'Money', robux: 'Robux', percent: 'Percentage' };
  const DEFAULT_STEPS = 'Sketch, Lineart, Render';
  const MAX_FILE = 50 * 1024 * 1024;

  const LS_DATA = 'atelier-ledger:data';
  const LS_REPO = 'atelier-ledger:repo';
  const LS_FOLD = 'atelier-ledger:collapsed';
  const OLD_KEYS = ['atelier-ledger:token', 'atelier-ledger:sync'];
  const LEDGER_PATH = 'ledger.json';

  const state = {
    clients: {}, commissions: {}, currency: '$', savedAt: '',
    filter: 'active', client: '', q: '',
    view: location.hash === '#clients' ? 'clients' : 'commissions',
    collapsed: new Set(), uploading: {},
  };
  const repo = { token: '', owner: '', name: '', sha: '', dirty: false, busy: false, again: false, timer: 0, status: 'off', msg: '', lastSynced: 0 };

  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysFrom = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
  const fmtDay = (s) => parseDay(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const num = (n) => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
  const money = (n) => state.currency + num(n);
  const robux = (n) => 'R$ ' + num(n);
  const amt = (unit, n) => unit === 'robux' ? robux(n) : money(n);
  const fmtSize = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  const splitSteps = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
  const connected = () => !!(repo.token && repo.owner && repo.name);

  function bytesToB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  const textToB64 = (t) => bytesToB64(new TextEncoder().encode(t));
  function b64ToText(b) { const bin = atob(b.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

  function ring(status) {
    const c = { todo: 'var(--ink-soft)', doing: 'var(--wash)', waiting: 'var(--gold)', done: 'var(--done)' }[status] || 'var(--ink-soft)';
    if (status === 'done') return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="${c}"/><path d="M10 5.2l1.3 3.5 3.5 1.3-3.5 1.3L10 14.8l-1.3-3.5L5.2 10l3.5-1.3z" fill="var(--card)"/></svg>`;
    if (status === 'doing') return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="${c}"/></svg>`;
    if (status === 'waiting') return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2.2 2.2"/><path d="M7 6h6M7 14h6M7.6 6.3c0 2.3 4.8 2.3 4.8 7.4M12.4 6.3c0 2.3-4.8 2.3-4.8 7.4" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round"/></svg>`;
    return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`;
  }
  const CHEVRON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const fx = { step: null, finished: null, unfold: null, newFiles: new Set() };
  const seenCards = new Set();
  const linger = new Set();
  const stampStart = new Map();
  let animateAll = true, sealsShown = false, prevEarned = null;
  const FX_COLORS = { todo: 'var(--ink-soft)', doing: 'var(--wash)', waiting: 'var(--gold)', done: 'var(--done)' };

  function burst(x, y, count, opts = {}) {
    if (calm.matches) return;
    const colors = opts.colors || ['var(--gold)', 'var(--wash)', 'var(--done)'];
    for (let k = 0; k < count; k++) {
      const el = document.createElement('span');
      el.className = 'spark' + (opts.dots || Math.random() < 0.3 ? ' dot' : '');
      el.setAttribute('aria-hidden', 'true');
      const ang = Math.random() * Math.PI * 2;
      const dist = (opts.far ? 70 : 26) + Math.random() * (opts.far ? 90 : 40);
      const size = (opts.far ? 7 : 5) + Math.random() * (opts.far ? 9 : 6);
      el.style.cssText = `left:${x}px;top:${y}px;--s:${size}px;--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist - (opts.far ? 30 : 10)}px;--r:${(Math.random() - 0.5) * 360}deg;--t:${600 + Math.random() * 500}ms;--c:${colors[k % colors.length]}`;
      el.addEventListener('animationend', () => el.remove());
      document.body.appendChild(el);
    }
  }
  function ripple(x, y, color) {
    if (calm.matches) return;
    const el = document.createElement('span');
    el.className = 'ripple';
    el.setAttribute('aria-hidden', 'true');
    el.style.cssText = `left:${x}px;top:${y}px;--c:${color}`;
    el.addEventListener('animationend', () => el.remove());
    document.body.appendChild(el);
  }
  function stampSvg(id) {
    const pid = 'sp-' + String(id).replace(/[^\w-]/g, '');
    const t0 = stampStart.get(id);
    const age = t0 === undefined ? Infinity : performance.now() - t0;
    if (age >= 3600) stampStart.delete(id);
    const stamping = age < 3600;
    const delay = stamping ? ` style="animation-delay:${-age}ms,${2400 - age}ms"` : '';
    return `<svg class="stamp${stamping ? ' stamping' : ''}"${delay} viewBox="0 0 100 100" aria-hidden="true"><defs><path id="${pid}" d="M50 50m-35 0a35 35 0 1 1 70 0a35 35 0 1 1-70 0"/></defs><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2.6"/><path d="M50 34l3.6 12.4L66 50l-12.4 3.6L50 66l-3.6-12.4L34 50l12.4-3.6z" fill="currentColor"/><text font-size="8.6" letter-spacing="2.4" fill="currentColor"><textPath href="#${pid}">COMPLETE ✦ ALL STEPS INKED ✦</textPath></text></svg>`;
  }
  function playFx() {
    if (fx.step) {
      const [c, p, i] = fx.step.key.split('|');
      const el = document.querySelector(`.step[data-c="${CSS.escape(c)}"][data-p="${CSS.escape(p)}"][data-i="${i}"]`);
      if (el) {
        el.classList.add('just-' + fx.step.status);
        const r = el.getBoundingClientRect();
        const x = r.left + 14, y = r.top + r.height / 2;
        ripple(x, y, FX_COLORS[fx.step.status]);
        if (fx.step.status === 'done') burst(x, y, 12);
      }
    }
    if (fx.finished && !calm.matches) {
      const st = document.querySelector(`#c-${CSS.escape(fx.finished)} .stamp`);
      if (st) { const r = st.getBoundingClientRect(); setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, 28, { far: true }), 420); }
    }
    fx.step = null; fx.finished = null; fx.unfold = null; fx.newFiles.clear();
  }
  function countUp(prev, now) {
    if (!prev) return;
    let grew = false;
    for (const k of ['money', 'robux']) {
      if (!(now[k] > prev[k])) continue;
      grew = true;
      const el = document.querySelector(`#earned [data-kind="${k}"]`);
      if (!el || calm.matches) continue;
      const from = prev[k], to = now[k], t0 = performance.now();
      const tick = (t) => {
        if (!el.isConnected) return;
        const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
        el.textContent = amt(k, p < 1 ? Math.round(from + (to - from) * e) : to);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    if (grew) {
      const box = document.getElementById('earned');
      if (box) { const r = box.getBoundingClientRect(); burst(r.left + 30, r.top + r.height / 2, 16, { colors: ['var(--gold)'], dots: true, far: true }); }
    }
  }
  function startMotes() {
    const cv = document.getElementById('motes');
    if (!cv || !cv.getContext || calm.matches) return;
    const ctx = cv.getContext('2d');
    let w = 0, h = 0, parts = [], raf = 0, last = 0;
    let rgb = getComputedStyle(document.documentElement).getPropertyValue('--mote').trim() || '168,118,38';
    const mk = (anywhere) => ({ x: Math.random() * w, y: anywhere ? Math.random() * h : h + 10, r: 0.6 + Math.random() * 1.6, vy: 0.12 + Math.random() * 0.35, ph: Math.random() * 6.28, sw: 0.3 + Math.random() * 0.6, star: Math.random() < 0.2 });
    const size = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = window.innerWidth; h = window.innerHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      parts = Array.from({ length: Math.round(Math.min(46, (w * h) / 30000)) }, () => mk(true));
    };
    const star = (x, y, r) => { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); };
    const frame = (t) => {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(50, last ? t - last : 16) / 16;
      last = t;
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.y -= p.vy * dt; p.ph += 0.02 * dt; p.x += Math.sin(p.ph) * p.sw * 0.3 * dt;
        if (p.y < -10) Object.assign(p, mk(false));
        ctx.fillStyle = `rgba(${rgb},${0.25 + 0.35 * (0.5 + 0.5 * Math.sin(p.ph * 1.7))})`;
        if (p.star) star(p.x, p.y, p.r * 2.6);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
      }
    };
    size();
    window.addEventListener('resize', size);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { rgb = getComputedStyle(document.documentElement).getPropertyValue('--mote').trim() || rgb; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
    raf = requestAnimationFrame(frame);
  }

  function derive(c) {
    const pieces = Array.isArray(c.pieces) ? c.pieces : [];
    let total = 0, done = 0, waiting = false;
    for (const p of pieces) for (const s of p.steps || []) {
      total++;
      if (s.status === 'done') done++;
      if (s.status === 'waiting') waiting = true;
    }
    const finished = pieces.length > 0 && total > 0 && done === total;
    return { pieces, total, done, waiting, finished };
  }
  function currentStep(p) {
    const steps = p.steps || [];
    const idx = steps.findIndex((s) => s.status !== 'done');
    return idx === -1 ? null : { idx, step: steps[idx] };
  }

  /* payment */
  function payType(c) { return PAY_TYPES[c.payType] ? c.payType : 'money'; }
  function payUnit(c) { const t = payType(c); return t === 'percent' ? (c.payoutIn === 'money' ? 'money' : 'robux') : t; }
  function received(c) {
    const t = payType(c);
    if (t === 'percent') return Number(c.received) || 0;
    const paid = c.paid || 'unpaid';
    if (paid === 'paid') return Number(c.price) || 0;
    if (paid === 'deposit') return Math.min(Number(c.deposit) || 0, Number(c.price) || Infinity);
    return 0;
  }
  function owed(c) { return payType(c) === 'percent' ? 0 : Math.max(0, (Number(c.price) || 0) - received(c)); }

  function clientName(id) { return state.clients[id]?.name || 'Unknown client'; }
  function clientCommissionCount(id) { return Object.values(state.commissions).filter((c) => c.clientId === id).length; }
  function showNotice(msg, kind) { const n = $('#notice'); n.textContent = msg; n.className = 'notice' + (kind === 'ok' ? ' ok' : ''); n.hidden = false; clearTimeout(showNotice.t); showNotice.t = setTimeout(() => { n.hidden = true; }, 8000); }

  /* ---------- local storage + changes ---------- */
  function payload() { return { version: 2, savedAt: state.savedAt, currency: state.currency, clients: state.clients, commissions: state.commissions }; }
  function saveLocal() { lsSet(LS_DATA, JSON.stringify(payload())); }
  function saveRepoMeta() { lsSet(LS_REPO, JSON.stringify({ token: repo.token, owner: repo.owner, name: repo.name, sha: repo.sha, dirty: repo.dirty })); }
  function saveFolds() { lsSet(LS_FOLD, JSON.stringify([...state.collapsed])); }
  function applyData(d) {
    state.clients = d && d.clients && typeof d.clients === 'object' ? d.clients : {};
    state.commissions = d && d.commissions && typeof d.commissions === 'object' ? d.commissions : {};
    state.currency = (d && d.currency) || '$';
    state.savedAt = (d && d.savedAt) || '';
    $('#currency').value = state.currency;
  }
  function commit() {
    state.savedAt = new Date().toISOString();
    saveLocal();
    render();
    if (connected()) {
      repo.dirty = true; saveRepoMeta();
      clearTimeout(repo.timer);
      repo.timer = setTimeout(push, 1200);
      setStatus('saving');
    }
  }
  function setStep(cid, pid, idx, status, note) {
    const c = state.commissions[cid];
    const p = c?.pieces?.find((x) => x.id === pid);
    const s = p?.steps?.[idx];
    if (!s) return;
    const wasFinished = derive(c).finished;
    const changed = s.status !== status;
    if (changed) s.since = todayStr();
    s.status = status;
    if (note !== undefined) s.note = note;
    c.updatedAt = new Date().toISOString();
    if (changed) fx.step = { key: cid + '|' + pid + '|' + idx, status };
    if (!wasFinished && derive(c).finished) { fx.finished = cid; linger.add(cid); stampStart.set(cid, performance.now()); }
    commit();
  }
  function editPieces(cid, mutate) {
    const c = state.commissions[cid];
    if (!c) return;
    if (!Array.isArray(c.pieces)) c.pieces = [];
    mutate(c.pieces);
    c.updatedAt = new Date().toISOString();
    commit();
  }

  /* ---------- GitHub repo sync (ledger.json + files/) ---------- */
  let queue = Promise.resolve();
  function enqueue(fn) { const run = queue.then(fn, fn); queue = run.catch(() => {}); return run; }

  async function gh(path, opts = {}, accept = 'application/vnd.github+json') {
    const headers = { Accept: accept, Authorization: 'Bearer ' + repo.token };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache: 'no-store' });
    if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return r;
  }
  const contentsPath = (p) => `/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.name)}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;

  async function readLedger() {
    let j;
    try { j = await (await gh(contentsPath(LEDGER_PATH))).json(); }
    catch (e) { if (e.status === 404) return null; throw e; }
    let text;
    if (j.content && j.encoding === 'base64') text = b64ToText(j.content);
    else text = await (await gh(contentsPath(LEDGER_PATH), {}, 'application/vnd.github.raw')).text();
    return { sha: j.sha, data: JSON.parse(text) };
  }
  async function writeLedger() {
    const body = { message: 'Update ledger', content: textToB64(JSON.stringify(payload(), null, 1)) };
    if (repo.sha) body.sha = repo.sha;
    const j = await (await gh(contentsPath(LEDGER_PATH), { method: 'PUT', body: JSON.stringify(body) })).json();
    repo.sha = j.content.sha;
  }

  function errMsg(e) {
    if (e && e.status === 401) return 'GitHub didn’t accept the token. It may have expired: open Sync settings and paste a new one.';
    if (e && (e.status === 403 || e.status === 404)) return 'The token can’t write to your data repository. Check its access in Sync settings.';
    if (e && e.status >= 500) return 'GitHub is having trouble. Your changes are kept here and will sync later.';
    return 'Offline. Your changes are kept here and will sync when you’re back online.';
  }
  function setStatus(kind, msg) { repo.status = kind; repo.msg = msg || ''; renderSync(); }
  function renderSync() {
    const dot = $('#sync-dot'), text = $('#sync-text');
    dot.className = 'dot ' + (repo.status === 'ok' ? 'ok' : repo.status === 'saving' ? 'saving' : repo.status === 'error' ? 'error' : 'off');
    if (!connected()) text.textContent = 'Saved in this browser only';
    else if (repo.status === 'saving') text.textContent = 'Saving to GitHub…';
    else if (repo.status === 'error') text.textContent = repo.msg;
    else if (repo.lastSynced) {
      const mins = Math.floor((Date.now() - repo.lastSynced) / 60000);
      text.textContent = 'Synced ' + (mins < 1 ? 'just now' : mins === 1 ? '1 min ago' : mins < 60 ? mins + ' min ago' : 'over an hour ago');
    } else text.textContent = 'Connected to GitHub';
  }
  setInterval(renderSync, 30000);

  async function push() {
    if (!connected()) return;
    if (repo.busy) { repo.again = true; return; }
    repo.busy = true; setStatus('saving');
    try {
      await enqueue(async () => {
        try { await writeLedger(); }
        catch (e) {
          if (e.status !== 409 && e.status !== 422) throw e;
          const cur = await readLedger();
          if (cur) { applyData(cur.data); repo.sha = cur.sha; saveLocal(); render(); }
          showNotice('The ledger was changed on your other computer, so this one loaded that version. If your last change is missing, redo it.');
        }
      });
      repo.dirty = false; saveRepoMeta();
      repo.lastSynced = Date.now(); setStatus('ok');
    } catch (e) {
      setStatus('error', errMsg(e));
    } finally {
      repo.busy = false;
      if (repo.again) { repo.again = false; push(); }
    }
  }
  async function pull() {
    if (!connected() || repo.busy) return;
    if (repo.dirty) { push(); return; }
    repo.busy = true;
    try {
      await enqueue(async () => {
        const cur = await readLedger();
        if (cur && cur.sha !== repo.sha) {
          if (cur.data.savedAt !== state.savedAt) { applyData(cur.data); saveLocal(); render(); }
          repo.sha = cur.sha; saveRepoMeta();
        }
      });
      repo.lastSynced = Date.now(); setStatus('ok');
    } catch (e) {
      setStatus('error', errMsg(e));
    } finally {
      repo.busy = false;
    }
  }

  async function connect(token, repoInput) {
    const prev = { ...repo };
    repo.token = token;
    try {
      let owner, name;
      const cleaned = repoInput.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
      if (cleaned.includes('/')) [owner, name] = cleaned.split('/');
      else {
        try { owner = (await (await gh('/user')).json()).login; }
        catch (e) { if (e.status === 401) throw e; const err = new Error('need-owner'); err.code = 'need-owner'; throw err; }
        name = cleaned;
      }
      let info;
      try { info = await (await gh(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`)).json(); }
      catch (e) { if (e.status === 404) { const err = new Error('no-repo'); err.code = 'no-repo'; throw err; } throw e; }
      if (!info.private) { const err = new Error('public'); err.code = 'public'; throw err; }
      repo.owner = info.owner.login; repo.name = info.name;
      const cur = await readLedger();
      let how;
      if (cur) { applyData(cur.data); repo.sha = cur.sha; saveLocal(); how = 'found'; }
      else { if (!state.savedAt) state.savedAt = new Date().toISOString(); repo.sha = ''; await writeLedger(); how = 'created'; }
      repo.dirty = false; saveRepoMeta();
      OLD_KEYS.forEach(lsDel);
      repo.lastSynced = Date.now(); setStatus('ok');
      render();
      return how;
    } catch (e) {
      Object.assign(repo, { token: prev.token, owner: prev.owner, name: prev.name, sha: prev.sha });
      throw e;
    }
  }
  function disconnect() {
    Object.assign(repo, { token: '', owner: '', name: '', sha: '', dirty: false });
    lsDel(LS_REPO);
    setStatus('off');
  }

  /* files */
  const thumbUrls = new Map();
  async function fileBlob(path) {
    const key = 'https://atelier-ledger.files/' + path;
    let cache = null;
    try { cache = await caches.open('atelier-ledger-files'); const hit = await cache.match(key); if (hit) return await hit.blob(); } catch (e) { cache = null; }
    const r = await gh(contentsPath(path), {}, 'application/vnd.github.raw');
    const blob = await r.blob();
    if (cache) { try { await cache.put(key, new Response(blob)); } catch (e) {} }
    return blob;
  }
  async function fileUrl(path) {
    if (thumbUrls.has(path)) return thumbUrls.get(path);
    const url = URL.createObjectURL(await fileBlob(path));
    thumbUrls.set(path, url);
    return url;
  }
  let thumbsLoading = false;
  async function loadThumbs() {
    if (thumbsLoading || !connected()) return;
    thumbsLoading = true;
    try {
      for (;;) {
        const img = document.querySelector('img[data-path]:not([src])');
        if (!img) break;
        const path = img.dataset.path;
        try { const url = await fileUrl(path); document.querySelectorAll(`img[data-path="${CSS.escape(path)}"]`).forEach((i) => { i.src = url; }); }
        catch (e) { document.querySelectorAll(`img[data-path="${CSS.escape(path)}"]`).forEach((i) => { i.replaceWith(Object.assign(document.createElement('span'), { textContent: 'Preview unavailable' })); }); }
      }
    } finally { thumbsLoading = false; }
  }
  function safeName(n) { return n.replace(/[^\w.\-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'file'; }

  function pickFiles(cid) {
    if (!connected()) { showNotice('Files are stored in your GitHub data repository. Turn on syncing in Sync settings first.'); syncDialog(); return; }
    const input = $('#file-input');
    input.value = '';
    input.onchange = () => { if (input.files.length) uploadFiles(cid, [...input.files]); };
    input.click();
  }
  async function uploadFiles(cid, files) {
    if (!connected()) { showNotice('Files are stored in your GitHub data repository. Turn on syncing in Sync settings first.'); return; }
    const c = state.commissions[cid];
    if (!c) return;
    const tooBig = files.filter((f) => f.size > MAX_FILE);
    files = files.filter((f) => f.size <= MAX_FILE);
    if (tooBig.length) showNotice(`${tooBig.map((f) => f.name).join(', ')} ${tooBig.length === 1 ? 'is' : 'are'} over 50 MB, so ${tooBig.length === 1 ? 'it wasn’t' : 'they weren’t'} added.`);
    if (!files.length) return;
    state.uploading[cid] = { done: 0, total: files.length };
    render();
    let failed = 0;
    for (const f of files) {
      try {
        const id = uid();
        const path = `files/${cid}/${id}-${safeName(f.name)}`;
        const content = bytesToB64(new Uint8Array(await f.arrayBuffer()));
        const j = await enqueue(async () => (await gh(contentsPath(path), { method: 'PUT', body: JSON.stringify({ message: 'Add ' + f.name, content }) })).json());
        thumbUrls.set(path, URL.createObjectURL(f));
        const cur = state.commissions[cid];
        if (cur) {
          if (!Array.isArray(cur.files)) cur.files = [];
          fx.newFiles.add(id);
          cur.files.push({ id, name: f.name, path, size: f.size, type: f.type || '', sha: j.content.sha, addedAt: new Date().toISOString() });
        }
      } catch (e) { failed++; }
      state.uploading[cid].done++;
      commit();
    }
    delete state.uploading[cid];
    render();
    if (failed) showNotice(`${failed} ${failed === 1 ? 'file' : 'files'} didn’t upload. Check your connection and try again.`);
  }
  async function removeFile(cid, fid) {
    const c = state.commissions[cid];
    const f = c?.files?.find((x) => x.id === fid);
    if (!f) return;
    try { await enqueue(() => gh(contentsPath(f.path), { method: 'DELETE', body: JSON.stringify({ message: 'Remove ' + f.name, sha: f.sha }) })); }
    catch (e) { if (e.status !== 404) { showNotice('Couldn’t remove that file. Check your connection and try again.'); return; } }
    c.files = c.files.filter((x) => x.id !== fid);
    commit();
  }
  function deleteRepoFiles(files) {
    if (!connected()) return;
    for (const f of files || []) enqueue(() => gh(contentsPath(f.path), { method: 'DELETE', body: JSON.stringify({ message: 'Remove ' + f.name, sha: f.sha }) })).catch(() => {});
  }
  async function downloadFile(f) {
    try {
      const blob = await fileBlob(f.path);
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href: url, download: f.name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (e) { showNotice('Couldn’t download that file. Check your connection and try again.'); }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  window.addEventListener('focus', () => pull());
  window.addEventListener('online', () => { if (repo.dirty) push(); else pull(); });
  setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 120000);

  /* ---------- render ---------- */
  function render() {
    if (animateAll) linger.clear();
    renderSeals();
    renderWaiting();
    renderClientFilter();
    renderSync();
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
    document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)));
    $('#filters').hidden = state.view !== 'commissions';
    $('#client-filter').hidden = state.view !== 'commissions';
    if (state.view === 'clients') renderClients(); else renderCommissions();
    loadThumbs();
    playFx();
    animateAll = false;
  }

  function renderSeals() {
    const today = todayStr();
    let doing = 0, waiting = 0, oldest = 0, dueSoon = 0, overdue = 0;
    const earned = { money: 0, robux: 0 }, due = { money: 0, robux: 0 };
    for (const c of Object.values(state.commissions)) {
      const d = derive(c);
      for (const p of d.pieces) {
        const cur = currentStep(p);
        if (!cur) continue;
        const w = (p.steps || []).find((s) => s.status === 'waiting');
        if (w) { waiting++; oldest = Math.max(oldest, w.since ? daysFrom(w.since, today) : 0); }
        else if (cur.step.status === 'doing') doing++;
      }
      if (!d.finished && c.due) {
        const left = daysFrom(today, c.due);
        if (left < 0) overdue++; else if (left <= 7) dueSoon++;
      }
      earned[payUnit(c)] += received(c);
      due[payUnit(c)] += owed(c);
    }
    const both = (o) => [o.money || !o.robux ? money(o.money) : '', o.robux ? robux(o.robux) : ''].filter(Boolean);
    const earnedParts = [earned.money || !earned.robux ? ['money', earned.money] : null, earned.robux ? ['robux', earned.robux] : null].filter(Boolean);
    const owedParts = [due.money ? money(due.money) : '', due.robux ? robux(due.robux) : ''].filter(Boolean);
    $('#seals').innerHTML = `
      <div class="seal wash"><span class="k">In progress</span><span class="v">${doing}</span><span class="s">${doing === 1 ? 'piece' : 'pieces'} on your desk</span></div>
      <div class="seal gold"><span class="k">Waiting on clients</span><span class="v">${waiting}</span><span class="s">${waiting ? 'longest: ' + oldest + (oldest === 1 ? ' day' : ' days') : 'nothing pending'}</span></div>
      <div class="seal ${overdue ? 'red' : ''}"><span class="k">Due this week</span><span class="v">${dueSoon + overdue}</span><span class="s">${overdue ? overdue + ' overdue' : 'next 7 days'}</span></div>
      <div class="seal"><span class="k">Earned</span><span class="v ${earnedParts.length > 1 ? 'multi' : ''}" id="earned">${earnedParts.map(([k, v]) => `<span data-kind="${k}">${esc(amt(k, v))}</span>`).join('<br>')}</span><span class="s">${owedParts.length ? 'Still owed: ' + esc(owedParts.join(' · ')) : 'Nothing owed'}</span></div>`;
    if (!sealsShown) { document.querySelectorAll('#seals .seal').forEach((el, k) => { el.classList.add('enter'); el.style.setProperty('--i', k); }); sealsShown = true; }
    countUp(prevEarned, earned);
    prevEarned = { ...earned };
  }

  function renderWaiting() {
    const today = todayStr();
    const items = [];
    for (const c of Object.values(state.commissions)) for (const p of c.pieces || []) (p.steps || []).forEach((s) => {
      if (s.status === 'waiting') items.push({ c, p, s, age: s.since ? daysFrom(s.since, today) : 0 });
    });
    items.sort((a, b) => b.age - a.age);
    $('#waiting').hidden = items.length === 0;
    $('#waiting-list').innerHTML = items.map((x) => `
      <li><button type="button" data-goto="${esc(x.c.id)}">
        <span class="age">${x.age === 0 ? 'today' : x.age + (x.age === 1 ? ' day' : ' days')}</span>
        <span><b>${esc(clientName(x.c.clientId))}</b> · ${esc(x.c.title)} · ${esc(x.p.name)} — ${esc(x.s.name)}</span>
        ${x.s.note ? `<span class="what">${esc(x.s.note)}</span>` : ''}
      </button></li>`).join('');
  }

  function renderClientFilter() {
    const sel = $('#client-filter');
    const list = Object.values(state.clients).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    if (state.client && !state.clients[state.client]) state.client = '';
    sel.innerHTML = '<option value="">All clients</option>' + list.map((c) => `<option value="${esc(c.id)}"${c.id === state.client ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  }

  function matchesSearch(c) {
    const q = state.q.trim().toLowerCase();
    if (!q) return true;
    const hay = [c.title, c.kind, c.notes, clientName(c.clientId), ...(c.pieces || []).map((p) => p.name), ...(c.files || []).map((f) => f.name)].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function renderCommissions() {
    const main = $('#main');
    main.className = 'list';
    const all = Object.values(state.commissions);
    if (all.length === 0) {
      main.innerHTML = `<div class="empty"><h2>No commissions yet</h2><p>Add a commission and list its pieces. Each piece gets its own sketch, lineart and render steps.</p><button class="btn" type="button" data-act="new-commission">+ New commission</button>${connected() ? '' : '<p>To use the same ledger on another computer and keep finished files, open <button type="button" class="link" data-act="sync">Sync settings</button> first.</p>'}</div>`;
      return;
    }
    const today = todayStr();
    const rows = all.map((c) => ({ c, d: derive(c) })).filter(({ c, d }) => {
      if (state.client && c.clientId !== state.client) return false;
      if (!matchesSearch(c)) return false;
      if (state.filter === 'active') return !d.finished || linger.has(c.id);
      if (state.filter === 'waiting') return d.waiting;
      if (state.filter === 'finished') return d.finished;
      return true;
    });
    rows.sort((a, b) => {
      if (a.d.finished !== b.d.finished) return a.d.finished ? 1 : -1;
      const ad = a.c.due || '9999-99-99', bd = b.c.due || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (b.c.createdAt || '').localeCompare(a.c.createdAt || '');
    });
    if (rows.length === 0) {
      const label = { active: 'in the works', waiting: 'waiting on a client', finished: 'finished', all: 'here' }[state.filter];
      main.innerHTML = `<div class="empty"><h2>Nothing ${label}</h2><p>Try another filter or clear the search.</p></div>`;
      return;
    }
    main.innerHTML = rows.map(({ c, d }, k) => folio(c, d, today, k)).join('');
    rows.forEach(({ c }) => seenCards.add(c.id));
  }

  function payBlock(c) {
    const t = payType(c);
    if (t === 'percent') {
      const unit = payUnit(c);
      return `<span class="price">${num(c.percent)}% <small>share</small></span>
        <div class="payrow"><span class="chip share">${esc(amt(unit, received(c)))} received</span><button type="button" class="link" data-act="log-payout" data-id="${esc(c.id)}">Log payout</button></div>`;
    }
    const paid = PAY[c.paid] ? c.paid : 'unpaid';
    const label = paid === 'deposit' && Number(c.deposit) ? `Deposit paid · ${amt(t, c.deposit)}` : PAY[paid];
    return `${c.price ? `<span class="price">${esc(amt(t, c.price))}</span>` : ''}
      <button type="button" class="chip pay-${paid}" data-act="cycle-paid" data-id="${esc(c.id)}" title="Click to change payment status">${esc(label)}</button>`;
  }

  function folio(c, d, today, k = 0) {
    const count = clientCommissionCount(c.clientId);
    const collapsed = state.collapsed.has(c.id);
    const ent = animateAll || !seenCards.has(c.id) ? ' enter' : '';
    const ord = `style="--i:${Math.min(k, 10)}"`;
    let due = '';
    if (c.due) {
      const left = daysFrom(today, c.due);
      if (d.finished) due = `<span class="chip">Due ${fmtDay(c.due)}</span>`;
      else if (left < 0) due = `<span class="chip overdue">${-left} ${left === -1 ? 'day' : 'days'} overdue</span>`;
      else if (left === 0) due = `<span class="chip soon">Due today</span>`;
      else due = `<span class="chip ${left <= 7 ? 'soon' : ''}">Due ${fmtDay(c.due)} · in ${left} ${left === 1 ? 'day' : 'days'}</span>`;
    }
    const pct = d.total ? Math.round((d.done / d.total) * 100) : 0;
    const head = `
      <div class="fhead">
        <button type="button" class="fold" data-act="fold" data-id="${esc(c.id)}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(c.title)}">${CHEVRON}</button>
        <div class="main">
          <h3>${esc(c.title)}</h3>
          <div class="meta">
            <button type="button" class="chip ${count > 1 ? 'repeat' : ''}" data-act="filter-client" data-id="${esc(c.clientId)}" title="Show only this client">${esc(clientName(c.clientId))}${count > 1 ? ' · ' + count + ' commissions' : ''}</button>
            ${c.kind ? `<span>${esc(c.kind)}</span>` : ''}
            ${due}
            ${d.finished ? '<span class="chip pay-paid">All steps done</span>' : collapsed ? `<span>${d.done} of ${d.total} steps done</span>` : ''}
            ${collapsed && c.files?.length ? `<span>${c.files.length} ${c.files.length === 1 ? 'file' : 'files'}</span>` : ''}
          </div>
        </div>
        <div class="fside">${payBlock(c)}</div>
      </div>`;
    if (collapsed) return `<article class="folio collapsed ${d.finished ? 'finished' : ''}${ent}" ${ord} id="c-${esc(c.id)}" data-cid="${esc(c.id)}">${head}</article>`;
    const pieces = d.pieces.map((p) => pieceRow(c, p, today)).join('');
    const up = state.uploading[c.id];
    const files = (c.files || []).map((f) => fileTile(c, f)).join('');
    return `
    <article class="folio ${d.finished ? 'finished' : ''}${ent}" ${ord} id="c-${esc(c.id)}" data-cid="${esc(c.id)}">
      ${head}
      <div class="fbody${fx.unfold === c.id ? ' unfolding' : ''}">
      <div class="progress"><span>${d.done} of ${d.total} steps done</span><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>
      ${c.notes ? `<p class="fnotes">${esc(c.notes)}</p>` : ''}
      ${pieces ? `<ul class="pieces">${pieces}</ul>` : '<p class="fnotes">No pieces yet.</p>'}
      ${files || up ? `<div class="files"><div class="files-head"><span>Files</span>${up ? `<span class="up">Uploading ${up.done + 1 > up.total ? up.total : up.done + 1} of ${up.total}…</span>` : ''}</div>${files ? `<ul class="file-grid">${files}</ul>` : ''}</div>` : ''}
      <div class="ffoot">
        <div class="actions">
          <button type="button" class="btn ghost small" data-act="add-piece" data-id="${esc(c.id)}">+ Add piece</button>
          <button type="button" class="btn ghost small" data-act="add-files" data-id="${esc(c.id)}">+ Add files</button>
        </div>
        <button type="button" class="link" data-act="edit-commission" data-id="${esc(c.id)}">Edit commission</button>
      </div>
      </div>
      ${d.finished ? stampSvg(c.id) : ''}
    </article>`;
  }

  function fileTile(c, f) {
    const isImg = /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp)$/i.test(f.name);
    const known = thumbUrls.get(f.path);
    const inner = isImg ? `<img alt="" data-path="${esc(f.path)}"${known ? ` src="${esc(known)}"` : ''}>` : `<span>${esc((f.name.split('.').pop() || 'file').toUpperCase())}</span>`;
    return `<li class="file${fx.newFiles.has(f.id) ? ' enter' : ''}">
      <button type="button" class="thumb" data-act="${isImg ? 'preview' : 'download'}" data-c="${esc(c.id)}" data-f="${esc(f.id)}" aria-label="${isImg ? 'Preview' : 'Download'} ${esc(f.name)}">${inner}</button>
      <div class="fmeta"><span class="fname" title="${esc(f.name)}">${esc(f.name)}</span><span class="fsize">${fmtSize(f.size || 0)}</span></div>
      <div class="facts">
        <button type="button" class="link" data-act="download" data-c="${esc(c.id)}" data-f="${esc(f.id)}">Download</button>
        <button type="button" class="link" data-act="remove-file" data-c="${esc(c.id)}" data-f="${esc(f.id)}">Remove</button>
      </div>
    </li>`;
  }

  function pieceRow(c, p, today) {
    const cur = currentStep(p);
    const w = (p.steps || []).find((s) => s.status === 'waiting');
    let now;
    if (!cur) now = `<span class="now">Finished</span>`;
    else if (w) {
      const age = w.since ? daysFrom(w.since, today) : 0;
      now = `<span class="now wait">${esc(w.name)}: waiting${w.note ? ' — ' + esc(w.note) : ''} · ${age === 0 ? 'since today' : age + (age === 1 ? ' day' : ' days')}</span>`;
    } else {
      now = `<span class="now">Now: ${esc(cur.step.name)} · ${(STATUS_LABEL[cur.step.status] || '').toLowerCase()}${cur.step.note ? ' — ' + esc(cur.step.note) : ''}</span>`;
    }
    const steps = (p.steps || []).map((s, i) => `
      <button type="button" class="step" data-status="${esc(s.status)}" data-act="step" data-c="${esc(c.id)}" data-p="${esc(p.id)}" data-i="${i}"
        aria-label="${esc(s.name)}: ${esc(STATUS_LABEL[s.status] || '')}" title="${esc(s.name)}: ${esc(STATUS_LABEL[s.status] || '')}${s.note ? ' — ' + esc(s.note) : ''}">
        ${ring(s.status)}<span>${esc(s.name)}</span></button>`).join('');
    return `
      <li class="piece">
        <div class="pname"><b>${esc(p.name)}</b>${now}</div>
        <div class="steps">${steps}</div>
        <div class="pacts">
          <button type="button" class="link" data-act="edit-piece" data-c="${esc(c.id)}" data-p="${esc(p.id)}">Edit</button>
          <button type="button" class="link" data-act="dup-piece" data-c="${esc(c.id)}" data-p="${esc(p.id)}">Duplicate</button>
        </div>
      </li>`;
  }

  function renderClients() {
    const main = $('#main');
    const q = state.q.trim().toLowerCase();
    const list = Object.values(state.clients)
      .filter((c) => !q || [c.name, c.contact, c.notes].join(' ').toLowerCase().includes(q))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    if (Object.keys(state.clients).length === 0) {
      main.className = 'list';
      main.innerHTML = `<div class="empty"><h2>No clients yet</h2><p>Add the people you draw for. Their commissions stay grouped under them, so repeat clients are easy to spot.</p><button class="btn" type="button" data-act="new-client">+ Client</button></div>`;
      return;
    }
    main.className = 'clients';
    main.innerHTML = list.map((cl, k) => {
      const comms = Object.values(state.commissions).filter((c) => c.clientId === cl.id);
      const active = comms.filter((c) => !derive(c).finished).length;
      const last = comms.map((c) => c.createdAt || '').sort().pop();
      const got = { money: 0, robux: 0 };
      comms.forEach((c) => { got[payUnit(c)] += received(c); });
      const gotText = [got.money ? money(got.money) : '', got.robux ? robux(got.robux) : ''].filter(Boolean).join(' · ');
      return `
      <article class="client${animateAll ? ' enter' : ''}" style="--i:${Math.min(k, 10)}">
        <h3>${esc(cl.name)}</h3>
        ${cl.contact ? `<span class="contact">${esc(cl.contact)}</span>` : ''}
        <div class="meta">
          <span class="chip ${comms.length > 1 ? 'repeat' : ''}">${comms.length} ${comms.length === 1 ? 'commission' : 'commissions'}</span>
          ${active ? `<span class="chip soon">${active} in the works</span>` : ''}
          ${gotText ? `<span>Earned ${esc(gotText)}</span>` : ''}
          ${last ? `<span>Last: ${new Date(last).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}</span>` : ''}
        </div>
        ${cl.notes ? `<p>${esc(cl.notes)}</p>` : ''}
        <div class="row">
          <button type="button" class="btn small" data-act="new-commission-for" data-id="${esc(cl.id)}">+ Commission</button>
          <button type="button" class="btn ghost small" data-act="filter-client" data-id="${esc(cl.id)}">See commissions</button>
          <button type="button" class="link" data-act="edit-client" data-id="${esc(cl.id)}">Edit</button>
        </div>
      </article>`;
    }).join('') || `<div class="empty"><h2>No matching clients</h2></div>`;
  }

  /* ---------- step popover ---------- */
  let pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function openStepMenu(btn) {
    closePop();
    const cid = btn.dataset.c, pid = btn.dataset.p, idx = Number(btn.dataset.i);
    const p = state.commissions[cid]?.pieces?.find((x) => x.id === pid);
    const s = p?.steps?.[idx];
    if (!s) return;
    pop = document.createElement('div');
    pop.className = 'pop';
    pop.dataset.for = cid + '|' + pid + '|' + idx;
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', `${p.name}: ${s.name}`);
    pop.innerHTML = `
      <div class="ph">${esc(p.name)} · ${esc(s.name)}</div>
      ${STATUSES.map(([k, label]) => `<button type="button" class="opt" data-status="${k}" aria-pressed="${s.status === k}">${ring(k)}<span>${label}</span></button>`).join('')}
      <label for="pop-note">${s.status === 'waiting' ? 'What are you waiting for?' : 'Note (optional)'}</label>
      <div class="noterow"><input id="pop-note" value="${esc(s.note || '')}" placeholder="e.g. sketch approval, references"><button type="button" class="btn small" data-save>Save</button></div>`;
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect();
    const w = pop.offsetWidth;
    const left = Math.min(Math.max(8, r.left + window.scrollX), window.scrollX + document.documentElement.clientWidth - w - 8);
    pop.style.left = left + 'px';
    pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
    const note = $('#pop-note', pop);
    let current = s.status;
    pop.addEventListener('click', (e) => {
      const opt = e.target.closest('.opt');
      if (opt) {
        current = opt.dataset.status;
        pop.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-pressed', String(o === opt)));
        setStep(cid, pid, idx, current, note.value.trim());
        if (current === 'waiting') { $('label', pop).textContent = 'What are you waiting for?'; note.focus(); }
        else closePop();
        return;
      }
      if (e.target.closest('[data-save]')) { setStep(cid, pid, idx, current, note.value.trim()); closePop(); }
    });
    note.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); setStep(cid, pid, idx, current, note.value.trim()); closePop(); } });
    pop.querySelector('.opt[aria-pressed="true"]')?.focus();
  }
  document.addEventListener('pointerdown', (e) => { if (pop && !pop.contains(e.target) && !e.target.closest('.step')) closePop(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
  window.addEventListener('resize', closePop);

  /* ---------- dialogs ---------- */
  const dlg = $('#dlg'), form = $('#dlg-form');
  let onSubmit = null;
  function openDialog(html, submit, wide) {
    closePop();
    form.innerHTML = html;
    form._onDelete = null;
    form._onDownload = null;
    dlg.classList.toggle('wide', !!wide);
    onSubmit = submit;
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    form.querySelector('input, select, textarea')?.focus();
  }
  function closeDialog() { if (dlg.open) dlg.close(); onSubmit = null; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!onSubmit) { closeDialog(); return; }
    const err = form.querySelector('.err');
    const btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;
    let result;
    try { result = await onSubmit(new FormData(form)); }
    finally { if (btn) btn.disabled = false; }
    if (typeof result === 'string') { if (err) { err.textContent = result; err.hidden = false; } return; }
    closeDialog();
  });
  form.addEventListener('input', () => { const err = form.querySelector('.err'); if (err) err.hidden = true; });
  form.addEventListener('click', (e) => {
    if (e.target.closest('[data-cancel]')) { e.preventDefault(); closeDialog(); return; }
    if (e.target.closest('[data-disconnect]')) { e.preventDefault(); disconnect(); closeDialog(); render(); return; }
    if (e.target.closest('[data-dl]')) { e.preventDefault(); form._onDownload && form._onDownload(); return; }
    const del = e.target.closest('[data-delete]');
    if (del) {
      e.preventDefault();
      if (!del.classList.contains('armed')) {
        del.classList.add('armed'); del.dataset.orig = del.textContent; del.textContent = 'Click again to delete';
        setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = del.dataset.orig; } }, 4000);
        return;
      }
      const fn = form._onDelete; closeDialog(); fn && fn();
    }
  });
  dlg.addEventListener('close', () => { onSubmit = null; });

  function clientOptions(selected) {
    const list = Object.values(state.clients).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    return list.map((c) => `<option value="${esc(c.id)}"${c.id === selected ? ' selected' : ''}>${esc(c.name)}</option>`).join('')
      + `<option value="__new"${!list.length || !state.clients[selected] ? ' selected' : ''}>New client…</option>`;
  }
  const n = (v) => (v === '' || v == null ? 0 : Number(v));

  function commissionDialog(cid, presetClient) {
    const c = cid ? state.commissions[cid] : null;
    const sel = c ? c.clientId : (presetClient || state.client || '');
    const t = c ? payType(c) : 'money';
    openDialog(`
      <h2>${c ? 'Edit commission' : 'New commission'}</h2>
      <label class="field"><span>Title</span><input name="title" required value="${esc(c?.title || '')}" placeholder="e.g. Forest tileset & item icons"></label>
      <div class="grid2">
        <label class="field"><span>Client</span><select name="clientId" id="f-client">${clientOptions(sel)}</select></label>
        <label class="field" id="f-newclient"><span>New client’s name</span><input name="newClient" placeholder="Name or handle"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Kind</span><input name="kind" value="${esc(c?.kind || '')}" placeholder="Game assets"></label>
        <label class="field"><span>Due</span><input type="date" name="due" value="${esc(c?.due || '')}"></label>
      </div>
      <div class="grid3">
        <label class="field"><span>Paid in</span><select name="payType" id="f-paytype">${Object.entries(PAY_TYPES).map(([k, v]) => `<option value="${k}"${t === k ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field" data-pay="fixed"><span id="f-price-label">Price</span><input type="number" name="price" min="0" step="any" value="${c?.price || ''}"></label>
        <label class="field" data-pay="fixed"><span>Payment</span><select name="paid" id="f-paid">${Object.entries(PAY).map(([k, v]) => `<option value="${k}"${(c?.paid || 'unpaid') === k ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field" data-pay="percent"><span>Share (%)</span><input type="number" name="percent" min="0" max="100" step="any" value="${c?.percent || ''}" placeholder="10"></label>
        <label class="field" data-pay="percent"><span>Paid out in</span><select name="payoutIn"><option value="robux"${c?.payoutIn !== 'money' ? ' selected' : ''}>Robux</option><option value="money"${c?.payoutIn === 'money' ? ' selected' : ''}>Money</option></select></label>
      </div>
      <label class="field" id="f-deposit"><span>Deposit received</span><input type="number" name="deposit" min="0" step="any" value="${c?.deposit || ''}"><small>Counts toward your earned total.</small></label>
      <label class="field" data-pay="percent"><span>Received so far</span><input type="number" name="received" min="0" step="any" value="${c?.received || ''}"><small>Total paid out to you from this share. You can also add payouts with “Log payout” on the card.</small></label>
      ${c ? '' : `
      <label class="field"><span>Pieces</span><textarea name="pieces" placeholder="One per line, e.g.&#10;Sword icon&#10;Shield icon&#10;Potion icon"></textarea><small>Each line becomes a piece with its own steps. Leave empty to add pieces later.</small></label>
      <label class="field"><span>Steps for each piece</span><input name="steps" value="${DEFAULT_STEPS}"><small>Comma-separated. You can change the steps of any single piece later.</small></label>`}
      <label class="field"><span>Notes</span><textarea name="notes" placeholder="Brief, references, sizes, file format…">${esc(c?.notes || '')}</textarea></label>
      <p class="err" hidden></p>
      <div class="dfoot">
        ${c ? '<button type="button" class="btn danger small" data-delete>Delete commission</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${c ? 'Save' : 'Add commission'}</button>
      </div>`, (fd) => {
      const title = fd.get('title').trim();
      if (!title) return 'Give the commission a title.';
      let clientId = fd.get('clientId');
      if (clientId === '__new') {
        const name = fd.get('newClient').trim();
        if (!name) return 'Enter the new client’s name, or pick an existing client.';
        clientId = uid();
        state.clients[clientId] = { id: clientId, name, contact: '', notes: '', createdAt: new Date().toISOString() };
      }
      const now = new Date().toISOString();
      const pt = fd.get('payType');
      const body = {
        title, clientId, kind: fd.get('kind').trim(), due: fd.get('due') || '',
        payType: pt, price: n(fd.get('price')), paid: fd.get('paid'), deposit: n(fd.get('deposit')),
        percent: n(fd.get('percent')), payoutIn: fd.get('payoutIn'), received: n(fd.get('received')),
        notes: fd.get('notes').trim(), updatedAt: now,
      };
      if (pt === 'percent' && !body.percent) return 'Enter the share percentage.';
      if (c) { Object.assign(c, body); commit(); return; }
      const stepNames = splitSteps(fd.get('steps') || '');
      const useSteps = stepNames.length ? stepNames : splitSteps(DEFAULT_STEPS);
      const names = (fd.get('pieces') || '').split('\n').map((x) => x.trim()).filter(Boolean);
      const id = uid();
      state.commissions[id] = {
        id, ...body, createdAt: now, files: [],
        pieces: names.map((name) => ({ id: uid(), name, steps: useSteps.map((s) => ({ name: s, status: 'todo', note: '', since: '' })) })),
      };
      if (state.filter === 'finished') state.filter = 'active';
      if (state.view !== 'commissions') state.view = 'commissions';
      commit();
    });
    form._onDelete = () => { const files = state.commissions[cid]?.files; delete state.commissions[cid]; state.collapsed.delete(cid); saveFolds(); deleteRepoFiles(files); commit(); };
    const sync = () => {
      $('#f-newclient', form).hidden = $('#f-client', form).value !== '__new';
      const pt = $('#f-paytype', form).value;
      form.querySelectorAll('[data-pay="fixed"]').forEach((el) => { el.hidden = pt === 'percent'; });
      form.querySelectorAll('[data-pay="percent"]').forEach((el) => { el.hidden = pt !== 'percent'; });
      $('#f-price-label', form).textContent = pt === 'robux' ? 'Price (R$)' : `Price (${state.currency})`;
      $('#f-deposit', form).hidden = pt === 'percent' || $('#f-paid', form).value !== 'deposit';
    };
    form.querySelectorAll('#f-client, #f-paytype, #f-paid').forEach((el) => el.addEventListener('change', sync));
    sync();
  }

  function payoutDialog(cid) {
    const c = state.commissions[cid];
    if (!c) return;
    const unit = payUnit(c);
    openDialog(`
      <h2>Log a payout</h2>
      <p class="hint">${esc(c.title)} · ${num(c.percent)}% share · ${esc(amt(unit, received(c)))} received so far</p>
      <label class="field"><span>Amount received (${unit === 'robux' ? 'R$' : esc(state.currency)})</span><input type="number" name="amount" min="0" step="any" required></label>
      <p class="err" hidden></p>
      <div class="dfoot">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">Add payout</button>
      </div>`, (fd) => {
      const a = n(fd.get('amount'));
      if (!(a > 0)) return 'Enter the amount you received.';
      c.received = (Number(c.received) || 0) + a;
      c.updatedAt = new Date().toISOString();
      commit();
    });
  }

  function clientDialog(id) {
    const cl = id ? state.clients[id] : null;
    const count = id ? clientCommissionCount(id) : 0;
    openDialog(`
      <h2>${cl ? 'Edit client' : 'New client'}</h2>
      <label class="field"><span>Name</span><input name="name" required value="${esc(cl?.name || '')}" placeholder="Name or handle"></label>
      <label class="field"><span>Contact</span><input name="contact" value="${esc(cl?.contact || '')}" placeholder="Email, Discord, Roblox…"></label>
      <label class="field"><span>Notes</span><textarea name="notes" placeholder="Preferences, past feedback, rates you agreed…">${esc(cl?.notes || '')}</textarea></label>
      <p class="err" hidden></p>
      <div class="dfoot">
        ${cl ? (count ? `<small style="color:var(--ink-soft)">Has ${count} ${count === 1 ? 'commission' : 'commissions'}, so it can’t be deleted.</small>` : '<button type="button" class="btn danger small" data-delete>Delete client</button>') + '<span class="spacer"></span>' : ''}
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${cl ? 'Save' : 'Add client'}</button>
      </div>`, (fd) => {
      const name = fd.get('name').trim();
      if (!name) return 'Enter a name.';
      const body = { name, contact: fd.get('contact').trim(), notes: fd.get('notes').trim() };
      if (cl) Object.assign(cl, body);
      else { const nid = uid(); state.clients[nid] = { id: nid, ...body, createdAt: new Date().toISOString() }; }
      commit();
    });
    form._onDelete = () => { delete state.clients[id]; commit(); };
  }

  function pieceDialog(cid, pid) {
    const c = state.commissions[cid];
    const p = pid ? c?.pieces?.find((x) => x.id === pid) : null;
    const lastSteps = (c?.pieces || []).slice(-1)[0]?.steps?.map((s) => s.name).join(', ');
    openDialog(`
      <h2>${p ? 'Edit piece' : 'Add pieces'}</h2>
      ${p ? `<label class="field"><span>Name</span><input name="name" required value="${esc(p.name)}"></label>`
          : `<label class="field"><span>Pieces</span><textarea name="names" required placeholder="One per line"></textarea></label>`}
      <label class="field"><span>Steps</span><input name="steps" value="${esc(p ? p.steps.map((s) => s.name).join(', ') : (lastSteps || DEFAULT_STEPS))}"><small>Comma-separated. Renaming a step resets it; steps you keep keep their progress.</small></label>
      <p class="err" hidden></p>
      <div class="dfoot">
        ${p ? '<button type="button" class="btn danger small" data-delete>Delete piece</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${p ? 'Save' : 'Add'}</button>
      </div>`, (fd) => {
      const stepNames = splitSteps(fd.get('steps') || '');
      if (!stepNames.length) return 'Add at least one step.';
      if (p) {
        const name = fd.get('name').trim();
        if (!name) return 'Give the piece a name.';
        editPieces(cid, () => {
          const old = Object.fromEntries(p.steps.map((s) => [s.name.toLowerCase(), s]));
          p.name = name;
          p.steps = stepNames.map((x) => old[x.toLowerCase()] ? { ...old[x.toLowerCase()], name: x } : { name: x, status: 'todo', note: '', since: '' });
        });
        return;
      }
      const names = (fd.get('names') || '').split('\n').map((x) => x.trim()).filter(Boolean);
      if (!names.length) return 'Enter at least one piece.';
      editPieces(cid, (pieces) => {
        for (const name of names) pieces.push({ id: uid(), name, steps: stepNames.map((x) => ({ name: x, status: 'todo', note: '', since: '' })) });
      });
    });
    form._onDelete = () => editPieces(cid, (pieces) => { const i = pieces.findIndex((x) => x.id === pid); if (i > -1) pieces.splice(i, 1); });
  }

  async function previewDialog(cid, fid) {
    const f = state.commissions[cid]?.files?.find((x) => x.id === fid);
    if (!f) return;
    openDialog(`
      <h2>${esc(f.name)}</h2>
      <img class="preview" id="pv" alt="${esc(f.name)}">
      <p class="hint" id="pv-status">Loading…</p>
      <div class="dfoot">
        <button type="button" class="btn ghost" data-cancel>Close</button>
        <button type="button" class="btn" data-dl>Download</button>
      </div>`, null, true);
    form._onDownload = () => downloadFile(f);
    try { $('#pv', form).src = await fileUrl(f.path); $('#pv-status', form).hidden = true; }
    catch (e) { $('#pv-status', form).textContent = 'Couldn’t load the preview. Check your connection.'; }
  }

  function syncDialog() {
    if (connected()) {
      openDialog(`
        <h2>Sync settings</h2>
        <p class="hint">This browser saves your ledger and files to <b>${esc(repo.owner)}/${esc(repo.name)}</b> on GitHub. ${esc($('#sync-text').textContent)}.</p>
        <p class="hint">Every save is a commit, so older versions are in the repository’s <a href="https://github.com/${esc(repo.owner)}/${esc(repo.name)}/commits" target="_blank" rel="noopener">history</a>.</p>
        <div class="dfoot">
          <button type="button" class="btn danger small" data-disconnect>Stop syncing in this browser</button>
          <span class="spacer"></span>
          <button type="button" class="btn ghost" data-cancel>Close</button>
          <button type="submit" class="btn">Sync now</button>
        </div>`, async () => { await (repo.dirty ? push() : pull()); });
      return;
    }
    openDialog(`
      <h2>Sync between your computers</h2>
      <p class="hint">Your ledger and finished files are saved to a private GitHub repository of your own, so any browser you connect opens the same ledger. The README has these steps with more detail.</p>
      <ol>
        <li><a href="https://github.com/new" target="_blank" rel="noopener">Create a repository</a> named <b>atelier-ledger-data</b>, set to <b>Private</b>.</li>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a fine-grained token</a>. Under Repository access choose <b>Only select repositories</b> and pick that repository. Under Permissions, set <b>Contents</b> to <b>Read and write</b>. Generate it and copy it.</li>
        <li>Paste the token below. Do the same in your other browser.</li>
      </ol>
      <label class="field"><span>GitHub token</span><input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><small>Kept only in this browser. It can only reach the one repository you picked.</small></label>
      <label class="field"><span>Repository</span><input name="repo" value="atelier-ledger-data" spellcheck="false"><small>Its name, or username/name.</small></label>
      <p class="hint">If the repository already has your ledger (from your other computer), this browser loads it and replaces what’s here.</p>
      <p class="err" hidden></p>
      <div class="dfoot">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">Connect</button>
      </div>`, async (fd) => {
      const token = (fd.get('token') || '').trim();
      const name = (fd.get('repo') || '').trim();
      if (!token) return 'Paste your GitHub token first.';
      if (!name) return 'Enter the repository name.';
      try {
        const how = await connect(token, name);
        showNotice(how === 'found' ? 'Connected. Loaded your ledger from GitHub.' : 'Connected. Your ledger now syncs to GitHub.', 'ok');
      } catch (e) {
        if (e.code === 'need-owner') return 'Enter the repository as username/atelier-ledger-data.';
        if (e.code === 'no-repo') return 'Couldn’t find that repository. Check the name, and that the token was given access to it.';
        if (e.code === 'public') return 'That repository is public. Make it private first (Settings → Danger Zone → Change visibility) so your files stay private.';
        if (e.status === 401) return 'GitHub didn’t accept that token. Check you copied all of it.';
        if (e.status === 403) return 'The token can’t write to that repository. Set Contents to “Read and write” on the token.';
        return 'Couldn’t reach GitHub. Check your connection and try again.';
      }
    });
  }

  /* ---------- events ---------- */
  function setView(v) {
    state.view = v;
    animateAll = true;
    try { history.replaceState(null, '', v === 'clients' ? '#clients' : location.pathname + location.search); } catch (e) {}
    render();
  }
  window.addEventListener('hashchange', () => { state.view = location.hash === '#clients' ? 'clients' : 'commissions'; render(); });

  $('#new-commission').addEventListener('click', () => commissionDialog());
  $('#new-client').addEventListener('click', () => clientDialog());
  $('#sync-open').addEventListener('click', syncDialog);
  $('#filters').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (b) { state.filter = b.dataset.filter; animateAll = true; render(); } });
  document.querySelector('.views').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('#client-filter').addEventListener('change', (e) => { state.client = e.target.value; animateAll = true; render(); });
  $('#search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  $('#currency').addEventListener('change', (e) => { state.currency = e.target.value.trim() || '$'; e.target.value = state.currency; commit(); });

  document.addEventListener('dragover', (e) => {
    const f = e.target.closest && e.target.closest('.folio');
    if (!f || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    document.querySelectorAll('.folio.dragging').forEach((x) => { if (x !== f) x.classList.remove('dragging'); });
    f.classList.add('dragging');
  });
  document.addEventListener('dragleave', (e) => { const f = e.target.closest && e.target.closest('.folio'); if (f && !f.contains(e.relatedTarget)) f.classList.remove('dragging'); });
  document.addEventListener('drop', (e) => {
    const f = e.target.closest && e.target.closest('.folio');
    document.querySelectorAll('.folio.dragging').forEach((x) => x.classList.remove('dragging'));
    if (!f || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    uploadFiles(f.dataset.cid, [...e.dataTransfer.files]);
  });

  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-goto]');
    if (go) {
      if (state.view !== 'commissions') setView('commissions');
      const id = go.dataset.goto;
      if (state.collapsed.delete(id)) saveFolds();
      render();
      if (!document.getElementById('c-' + id)) { state.filter = 'all'; state.client = ''; state.q = ''; $('#search').value = ''; render(); }
      const el = document.getElementById('c-' + id);
      if (el) { el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      return;
    }
    const b = e.target.closest('[data-act]');
    if (!b || b.closest('dialog')) return;
    const act = b.dataset.act;
    const fileOf = () => state.commissions[b.dataset.c]?.files?.find((x) => x.id === b.dataset.f);
    if (act === 'step') {
      const key = b.dataset.c + '|' + b.dataset.p + '|' + b.dataset.i;
      if (pop && pop.dataset.for === key) { closePop(); return; }
      openStepMenu(b);
    }
    else if (act === 'fold') {
      const id = b.dataset.id;
      if (state.collapsed.has(id)) { state.collapsed.delete(id); fx.unfold = id; saveFolds(); render(); }
      else {
        const body = document.getElementById('c-' + id)?.querySelector('.fbody');
        const go = () => { state.collapsed.add(id); saveFolds(); render(); };
        if (body && !calm.matches) { body.classList.add('folding'); b.setAttribute('aria-expanded', 'false'); setTimeout(go, 170); } else go();
      }
    }
    else if (act === 'new-commission') commissionDialog();
    else if (act === 'new-commission-for') commissionDialog(null, b.dataset.id);
    else if (act === 'new-client') clientDialog();
    else if (act === 'edit-client') clientDialog(b.dataset.id);
    else if (act === 'edit-commission') commissionDialog(b.dataset.id);
    else if (act === 'add-piece') pieceDialog(b.dataset.id);
    else if (act === 'add-files') pickFiles(b.dataset.id);
    else if (act === 'log-payout') payoutDialog(b.dataset.id);
    else if (act === 'edit-piece') pieceDialog(b.dataset.c, b.dataset.p);
    else if (act === 'sync') syncDialog();
    else if (act === 'preview') previewDialog(b.dataset.c, b.dataset.f);
    else if (act === 'download') { const f = fileOf(); if (f) downloadFile(f); }
    else if (act === 'remove-file') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = 'Click again to remove';
        setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Remove'; } }, 4000);
        return;
      }
      removeFile(b.dataset.c, b.dataset.f);
    }
    else if (act === 'dup-piece') editPieces(b.dataset.c, (pieces) => {
      const i = pieces.findIndex((x) => x.id === b.dataset.p);
      if (i === -1) return;
      const copy = JSON.parse(JSON.stringify(pieces[i]));
      copy.id = uid(); copy.name = copy.name + ' (copy)';
      copy.steps = copy.steps.map((s) => ({ name: s.name, status: 'todo', note: '', since: '' }));
      pieces.splice(i + 1, 0, copy);
    });
    else if (act === 'cycle-paid') { const c = state.commissions[b.dataset.id]; if (c) { c.paid = PAY_NEXT[c.paid] || 'deposit'; c.updatedAt = new Date().toISOString(); commit(); } }
    else if (act === 'filter-client') { state.client = b.dataset.id; state.filter = 'all'; setView('commissions'); }
  });

  /* ---------- boot ---------- */
  try { const d = JSON.parse(lsGet(LS_DATA) || 'null'); if (d) applyData(d); } catch (e) {}
  try { state.collapsed = new Set(JSON.parse(lsGet(LS_FOLD) || '[]')); } catch (e) {}
  try { const m = JSON.parse(lsGet(LS_REPO) || 'null'); if (m) Object.assign(repo, { token: m.token || '', owner: m.owner || '', name: m.name || '', sha: m.sha || '', dirty: !!m.dirty }); } catch (e) {}
  if (connected()) setStatus('saving');
  render();
  startMotes();
  if (connected()) { if (repo.dirty) push(); else pull(); }
})();
</script>
</body>
</html>
